        ::-webkit-scrollbar-thumb { background: #292524; border-radius: 10px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .editor-content { min-height: 200px; outline: none; white-space: pre-wrap; }
        .editor-content b { font-weight: 900; color: #fff; }
        .editor-content i { font-style: italic; color: #a7f3d0; }
        .editor-content u { text-decoration: underline; text-decoration-color: #059669; }
    </style>
</head>

            { id: 'mud', name: 'MudWing', color: 'bg-amber-800' },

            { id: 'ice', name: 'IceWing', color: 'bg-slate-200 text-stone-900' },

        const BOOKS = [
            { title: "The Dragonet Prophecy", chapters: 35, questions: [{ ch: [1,35], q: "Who is the MudWing dragonet?", a: "Clay", opts: ["Clay", "Reed", "Sora"] }]},
            { title: "The Lost Heir", chapters: 30, questions: [{ ch: [1,30], q: "Who is the Queen of the SeaWings?", a: "Coral", opts: ["Coral", "Anemone", "Orca"] }]},
            { title: "The Hidden Kingdom", chapters: 30, questions: [{ ch: [1,30], q: "Who is Glory's brother?", a: "Jambu", opts: ["Jambu", "Mangrove", "Liana"] }]},
            { title: "The Dark Secret", chapters: 30, questions: [{ ch: [1,30], q: "Where do NightWings live?", a: "Volcano", opts: ["Cave", "Volcano", "Island"] }]},

        ];

        const MATH_QUESTIONS = [
            { q: "If Clay eats 5 cows and Tsunami eats 3, how many cows were eaten?", a: 8 },
            { q: "A SkyWing flies 50 miles per hour. How far do they fly in 3 hours?", a: 150 },
            { q: "Starflight has 20 scrolls. He lends 7 to Sunny. How many are left?", a: 13 },
            { q: "7 tribes. 2 are at war. How many are at peace?", a: 5 },
            { q: "Winter freezes 12 scavengers. He unfreezes 4. How many are still frozen?", a: 8 }
        ];

        const NPCS = [
            { id: 'clay', name: 'Clay', tribe: 'MudWing', img: 'https://static.wikia.nocookie.net/wingsoffire/images/0/02/Clay_GN_Infobox.png', agent: 'https://agent.jotform.com/019bd3c38eaf74f1a5d9d739df35de42390e?embedMode=iframe&background=1&shadow=1' },
            { id: 'tsunami', name: 'Tsunami', tribe: 'SeaWing', img: 'https://static.wikia.nocookie.net/wingsoffire/images/5/53/Tsunami_Graphic_Novel.png', agent: 'https://agent.jotform.com/019bd39c7f5472bc968724f259bfdddc2c70?embedMode=iframe&background=1&shadow=1' },
            { id: 'glory', name: 'Glory', tribe: 'RainWing', img: 'https://static.wikia.nocookie.net/wingsoffire/images/f/f0/Glory_GN_Infobox.png' },
            { id: 'starflight', name: 'Starflight', tribe: 'NightWing', img: 'https://static.wikia.nocookie.net/wingsoffire/images/5/5d/Starflight_GN_Infobox.png' },
            { id: 'sunny', name: 'Sunny', tribe: 'SandWing', img: 'https://static.wikia.nocookie.net/wingsoffire/images/1/1b/Sunny_GN_Infobox.png' }
        ];

        function App() {
            const [user, setUser] = useState(null);
            const [location, setLocation] = useState('hall');
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [activeCall, setActiveCall] = useState(null);
            
            // Academic State
            const [mathScore, setMathScore] = useState(0);
            const [mathQ, setMathQ] = useState(null);
            const [mathFeedback, setMathFeedback] = useState("");
            const [scrollTitle, setScrollTitle] = useState("");
            const [selectedBook, setSelectedBook] = useState(BOOKS[0]);
            const [quizQ, setQuizQ] = useState(null);
            const [quizFeedback, setQuizFeedback] = useState("");
            const [libraryTab, setLibraryTab] = useState('books');
            const [publicScrolls, setPublicScrolls] = useState([]);
            const [isPublishing, setIsPublishing] = useState(false);
            
            // Writing Studio State
            const [currentPrompt, setCurrentPrompt] = useState(null);
            const [scrollRating, setScrollRating] = useState(null);
            
            // Google State
            const [isGoogleConnected, setIsGoogleConnected] = useState(false);
            const [isConnecting, setIsConnecting] = useState(false);
            const [showHelp, setShowHelp] = useState(false);

            const scrollContentRef = useRef(null);

            // Initialize Data from LocalStorage (Simulated Cloud)
            useEffect(() => {
                const savedUser = localStorage.getItem('jma_v4_user');
                if (savedUser) {
                    const parsed = JSON.parse(savedUser);
                    setUser(parsed);
                    setIsGoogleConnected(parsed.googleConnected || false);
                }
                
                // Load Scrolls
                const savedScrolls = localStorage.getItem('jma_scrolls');
                if (savedScrolls) {
                    setPublicScrolls(JSON.parse(savedScrolls));
                }
            }, []);

            const handleLogin = (name, tribeId) => {
                const newUser = { name, tribe: TRIBES.find(t => t.id === tribeId), googleConnected: false };
                setUser(newUser);
                localStorage.setItem('jma_v4_user', JSON.stringify(newUser));
            };

            const connectGoogle = () => {
                setIsConnecting(true);
                setTimeout(() => {
                    setIsConnecting(false);
                    setIsGoogleConnected(true);
                    const updatedUser = { ...user, googleConnected: true };
                    setUser(updatedUser);
                    localStorage.setItem('jma_v4_user', JSON.stringify(updatedUser));
                    window.open(GOOGLE_CLASSROOM_LINK, '_blank');
                }, 2000);
            };

            const copyCode = () => { navigator.clipboard.writeText(CLASS_CODE); alert("Class Code Copied: " + CLASS_CODE); };
            const copyLink = () => { navigator.clipboard.writeText(GOOGLE_CLASSROOM_LINK); alert("Invite Link Copied!"); };

            // Academic Logic
            const generateMathQ = () => { setMathQ(MATH_QUESTIONS[Math.floor(Math.random() * MATH_QUESTIONS.length)]); setMathFeedback(""); };
            const checkMath = (ans) => { if(parseInt(ans) === mathQ.a) { setMathScore(s=>s+10); setMathFeedback("Correct!"); setTimeout(generateMathQ, 1500); } else setMathFeedback("Try again."); };
            const generateQuiz = () => { setQuizQ(selectedBook.questions[0]); setQuizFeedback(""); };
            const checkQuiz = (a) => { setQuizFeedback(a === quizQ.a ? "Correct!" : "Incorrect."); };
            
            // Rich Text Logic
            const execCmd = (command, value = null) => {
                document.execCommand(command, false, value);
                scrollContentRef.current.focus();
            };

            const generatePrompt = () => {
                const prompt = WRITING_PROMPTS[Math.floor(Math.random() * WRITING_PROMPTS.length)];
                setCurrentPrompt(prompt);
                setScrollRating(null);
                if (scrollTitle === "") setScrollTitle("My " + prompt.keywords[0] + " Story");
            };

            const rateScroll = () => {
                if (!scrollContentRef.current) return;
                const text = scrollContentRef.current.innerText.toLowerCase();
                const wordCount = text.split(/\s+/).length;
                
                if (wordCount < 5) {
                    alert("Your scroll is too short to rate! Write at least a sentence.");
                    return;
                }

                let score = 0; 
                let feedback = "";

                if (currentPrompt) {
                    // 1. Check Prompt Relevance (Must match 2 words to pass)
                    let matches = 0;
                    currentPrompt.keywords.forEach(word => { if (text.includes(word)) matches++; });
                    
                    if (matches < 2) {
                        score = 40 + (matches * 10);
                        feedback = "This is a good story, but it doesn't match the prompt! Starflight is confused.";
                    } else {
                        score = 60 + (matches * 5); // Base score for being on topic
                        
                        // 2. Lore Bonus (Only applies if on topic)
                        const loreWords = ["clearsight", "pantala", "animus", "darkstalker", "scavenger", "prophecy", "moon", "jade", "2,000", "2000", "pyrrhia", "three moons"];
                        let loreBonus = 0;
                        loreWords.forEach(w => { if (text.includes(w)) loreBonus += 5; });
                        
                        score += loreBonus;
                        
                        if (score >= 100) feedback = "Perfect! You followed the prompt AND added amazing lore details!";
                        else if (score >= 80) feedback = "Great job! You stayed on topic.";
                        else feedback = "Good effort. Try adding more specific details from the prompt.";
                    }
                } else {
                    // Freestyle mode
                    score = 50 + Math.min(wordCount, 30);
                    const loreWords = ["clearsight", "pantala", "animus", "darkstalker"];
                    let loreBonus = 0;
                    loreWords.forEach(w => { if (text.includes(w)) loreBonus += 10; });
                    score += loreBonus;
                    feedback = "Nice freestyle writing! Try using a prompt next time for a challenge.";
                }
                
                score = Math.min(Math.max(score, 0), 100);
                
                setScrollRating({ score, feedback });
            };

            const publishScroll = () => {
                if (!scrollTitle.trim()) { alert("Please give your scroll a title!"); return; }
                const content = scrollContentRef.current.innerHTML;
                if (!content.trim() || content === '<br>') { alert("The scroll is empty!"); return; }

                setIsPublishing(true);
                setTimeout(() => {
                    const newScroll = {
                        id: Date.now(),
                        title: scrollTitle,
                        content: content,
                        author: user.name,
                        tribe: user.tribe.name,
                        timestamp: new Date().toLocaleDateString()
                    };
                    
                    const updatedScrolls = [newScroll, ...publicScrolls];
                    setPublicScrolls(updatedScrolls);
                    localStorage.setItem('jma_scrolls', JSON.stringify(updatedScrolls));
                    
                    alert("Scroll Published to the Archives!");
                    setScrollTitle("");
                    scrollContentRef.current.innerHTML = "";
                    setScrollRating(null);
                    setCurrentPrompt(null);
                    setIsPublishing(false);
                }, 1000);
            };

            if (!user) return <LoginScreen onLogin={handleLogin} />;
            const currentLocData = LOCATIONS.find(l => l.id === location);

            return (
                <div className="flex h-screen w-full bg-stone-950 text-stone-100 overflow-hidden font-sans">
                    {activeCall && (
                        <div className="fixed inset-0 z-50 bg-black/95 flex flex-col items-center justify-center p-4 safe-top safe-bottom">
                            <div className="relative w-full h-full max-w-4xl bg-stone-900 rounded-3xl overflow-hidden border border-white/10 shadow-2xl">
                                <button onClick={() => setActiveCall(null)} className="absolute top-4 right-4 z-50 p-2 bg-red-600 rounded-full"><Icons.X /></button>
                                {activeCall.agent ? <iframe src={activeCall.agent} className="w-full h-full" allow="microphone; camera;" /> : <div className="flex items-center justify-center h-full"><h2 className="text-2xl font-bold">Dream Visitor Connected...</h2></div>}
                            </div>
                        </div>
                    )}

                    <aside className={`fixed md:relative inset-y-0 left-0 w-72 bg-stone-900 border-r border-white/5 z-40 transform transition-transform duration-300 safe-top safe-bottom ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                        <div className="p-8 border-b border-white/5 bg-stone-950/50">
                            <h1 className="text-xl font-black uppercase text-emerald-400 italic">Jade Mountain</h1>
                            <p className="text-[10px] font-bold uppercase text-stone-500 tracking-[0.2em] mt-1">Student Portal</p>
                        </div>
                        <div className="p-4 space-y-4 h-full overflow-y-auto">
                            <div className="flex items-center gap-3 p-3 glass rounded-xl">
                                <div className={`w-10 h-10 rounded-full ${user.tribe.color}`}></div>
                                <div><p className="font-bold text-sm">{user.name}</p><p className="text-[10px] text-stone-400">{isGoogleConnected ? 'Verified Student' : 'Guest'}</p></div>
                            </div>
                            <nav className="space-y-1">
                                {LOCATIONS.map(loc => (
                                    <button key={loc.id} onClick={() => { setLocation(loc.id); setIsSidebarOpen(false); }} className={`w-full text-left p-3 rounded-xl text-sm font-bold flex items-center gap-3 transition ${location === loc.id ? 'bg-emerald-600 text-white' : 'text-stone-500 hover:bg-white/5'}`}>
                                        {loc.id === 'google' ? <Icons.Users /> : <Icons.Menu />} {loc.name}
                                    </button>
                                ))}
                            </nav>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col h-full bg-stone-950 relative">
                        <header className="h-16 border-b border-white/5 flex items-center justify-between px-6 safe-top bg-stone-900/50 backdrop-blur-md z-30">
                            <div className="flex items-center gap-3">
                                <button onClick={() => setIsSidebarOpen(true)} className="md:hidden"><Icons.Menu /></button>
                                <h2 className="font-black text-xl uppercase italic">{currentLocData.name}</h2>
                            </div>
                        </header>

                        <section className={`flex-1 overflow-y-auto relative p-6 ${currentLocData.bg}`}>
                            {location === 'writing' && (
                                <div className="max-w-4xl mx-auto h-full flex flex-col gap-4">
                                    <div className="glass p-4 rounded-2xl flex flex-col gap-4">
                                        <div className="flex justify-between items-center">
                                            <h2 className="text-xl font-bold flex items-center gap-2"><Icons.Pen /> Scroll Studio</h2>
                                            <div className="flex gap-2">
                                                <button onClick={generatePrompt} className="px-4 py-2 bg-indigo-600 rounded-lg text-xs font-bold hover:bg-indigo-500 flex items-center gap-2"><Icons.Sparkles /> Get Prompt</button>
                                                <button onClick={rateScroll} className="px-4 py-2 bg-amber-600 rounded-lg text-xs font-bold hover:bg-amber-500 flex items-center gap-2"><Icons.Medal /> Starflight's Grade</button>
                                            </div>
                                        </div>
                                        {currentPrompt && (
                                            <div className="bg-indigo-900/30 border border-indigo-500/30 p-3 rounded-xl text-sm italic text-indigo-200">
                                                <span className="font-bold not-italic text-indigo-400">Assignment:</span> {currentPrompt.text}
                                            </div>
                                        )}
                                        {scrollRating && (
                                            <div className="bg-stone-800 border border-stone-600 p-3 rounded-xl flex justify-between items-center animate-fade-in">
                                                <div><span className="font-bold text-emerald-400">Score: {scrollRating.score}/100</span><span className="text-stone-400 text-xs ml-3 border-l border-stone-600 pl-3">{scrollRating.feedback}</span></div>
                                                {scrollRating.score > 80 && <div className="text-xl">🌟</div>}
                                            </div>
                                        )}
                                        <input value={scrollTitle} onChange={(e) => setScrollTitle(e.target.value)} placeholder="Scroll Title..." className="w-full bg-transparent text-xl font-bold placeholder-stone-600 outline-none border-b border-white/10 pb-2 focus:border-emerald-500 transition-colors" />
                                        <div className="flex gap-2 items-center flex-wrap bg-stone-900/50 p-2 rounded-lg">
                                            <button onClick={() => execCmd('bold')} className="p-2 hover:bg-stone-700 rounded"><Icons.Bold /></button>
                                            <button onClick={() => execCmd('italic')} className="p-2 hover:bg-stone-700 rounded"><Icons.Italic /></button>
                                            <button onClick={() => execCmd('underline')} className="p-2 hover:bg-stone-700 rounded"><Icons.Underline /></button>
                                            <div className="flex-1"></div>
                                            <button onClick={publishScroll} disabled={isPublishing} className="flex items-center gap-2 px-4 py-2 bg-emerald-600 rounded-lg text-xs font-bold hover:bg-emerald-500 shadow-lg active:scale-95 transition-transform">{isPublishing ? "Publishing..." : <><Icons.Cloud /> Publish to Archives</>}</button>
                                        </div>
                                    </div>
                                    <div ref={scrollContentRef} contentEditable className="editor-content flex-1 bg-stone-100 text-stone-900 p-8 rounded-2xl overflow-y-auto text-lg leading-relaxed shadow-inner font-serif" data-placeholder="Start writing..." style={{minHeight: '300px'}}></div>
                                </div>
                            )}

                            {location === 'google' && (
                                <div className="max-w-md mx-auto glass p-8 rounded-3xl animate-fade-in flex flex-col items-center text-center space-y-6">
                                    <div className="w-24 h-24 bg-white rounded-full flex items-center justify-center shadow-2xl">
                                        <div className={`w-20 h-20 rounded-full ${user.tribe.color} flex items-center justify-center text-3xl font-black`}>{user.name[0]}</div>
                                    </div>
                                    <div><h2 className="text-2xl font-black text-white">{user.name}</h2><p className="text-stone-400 text-sm uppercase tracking-widest">{user.tribe.name}</p></div>
                                    <div className="w-full bg-stone-900/50 p-4 rounded-xl border border-white/5">
                                        <p className="text-xs text-stone-500 uppercase font-bold mb-2">Classroom Status</p>
                                        <div className="flex items-center justify-center gap-2">
                                            <div className={`w-3 h-3 rounded-full ${isGoogleConnected ? 'bg-emerald-500' : 'bg-red-500'}`}></div>
                                            <span className="font-bold">{isGoogleConnected ? 'Connected & Enrolled' : 'Not Connected'}</span>
                                        </div>
                                    </div>
                                    {!isGoogleConnected ? (
                                        <button onClick={connectGoogle} disabled={isConnecting} className="w-full g-btn justify-center shadow-lg active:scale-95 transition-transform cursor-pointer"><div className="g-icon"><Icons.Google /></div>{isConnecting ? "Connecting..." : "Connect Google Account"}</button>
                                    ) : (
                                        <div className="w-full space-y-4">
                                            <a href={GOOGLE_CLASSROOM_LINK} target="_blank" className="w-full py-3 bg-emerald-600 rounded-xl font-bold hover:bg-emerald-500 transition-colors block shadow-lg">Open Google Classroom</a>
                                            <div className="p-4 bg-red-900/10 border border-red-500/20 rounded-xl text-left space-y-4">
                                                <div className="flex justify-between items-center">
                                                    <div className="flex items-center gap-2 text-red-300 font-bold"><Icons.Alert /> Still Not Working?</div>
                                                    <button onClick={()=>setShowHelp(!showHelp)} className="text-xs text-red-400 underline">Solution</button>
                                                </div>
                                                {showHelp && (
                                                    <div className="text-xs text-stone-300 bg-stone-900/80 p-3 rounded space-y-2">
                                                        <p className="font-bold text-red-400">🚨 Account Conflict Detected</p>
                                                        <p>If you made the class with a Personal Gmail, you MUST join with a Personal Gmail. School (.edu) emails will not work.</p>
                                                        <a href="https://accounts.google.com/Logout" target="_blank" className="block w-full py-2 bg-stone-700 text-center rounded hover:bg-stone-600 flex items-center justify-center gap-2 mt-2"><Icons.Switch /> Switch Google Accounts</a>
                                                    </div>
                                                )}
                                                <div className="bg-stone-950 p-4 rounded-lg text-center border border-white/5 relative">
                                                    <p className="text-xs text-stone-500 font-bold uppercase mb-2">Class Code</p>
                                                    <p className="text-2xl font-mono text-emerald-400 tracking-widest select-all">{CLASS_CODE}</p>
                                                    <button onClick={copyCode} className="absolute right-2 top-2 text-stone-500 hover:text-white"><Icons.Copy/></button>
                                                </div>
                                                <div className="grid grid-cols-2 gap-2">
                                                    <button onClick={copyLink} className="py-2 bg-stone-800 rounded-lg text-xs font-bold hover:bg-stone-700">Copy Invite Link</button>
                                                    <a href="https://classroom.google.com/" target="_blank" className="block py-2 bg-stone-800 text-center rounded-lg text-xs font-bold hover:bg-stone-700">Go to Classroom</a>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {location === 'library' && (
                                <div className="max-w-2xl mx-auto space-y-6 animate-fade-in h-full flex flex-col">
                                    <div className="flex gap-2">
                                        <button onClick={() => setLibraryTab('books')} className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all ${libraryTab === 'books' ? 'bg-amber-600 text-white shadow-lg' : 'bg-stone-800 text-stone-400'}`}>Books & Reading</button>
                                        <button onClick={() => setLibraryTab('scrolls')} className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all ${libraryTab === 'scrolls' ? 'bg-emerald-600 text-white shadow-lg' : 'bg-stone-800 text-stone-400'}`}>Student Archives</button>
                                    </div>
                                    {libraryTab === 'books' ? (
                                        <div className="space-y-6 overflow-y-auto pb-4">
                                            <div className="glass p-6 rounded-3xl mb-6 border border-blue-400/30 relative overflow-hidden">
                                                <div className="absolute top-0 right-0 p-4 opacity-10"><Icons.Book size={64} /></div>
                                                <h3 className="text-xl font-black text-blue-400 mb-2 uppercase italic">Epic! Reading Room</h3>
                                                <p className="text-sm text-stone-300 mb-4">Read thousands of books online with our class code.</p>
                                                <div className="bg-stone-900/80 p-4 rounded-xl flex items-center justify-between border border-blue-500/20 mb-4">
                                                    <div><p className="text-[10px] font-bold uppercase text-stone-500 tracking-widest">Class Code</p><p className="text-2xl font-mono text-blue-400 tracking-widest select-all">{EPIC_CODE}</p></div>
                                                    <button onClick={() => {navigator.clipboard.writeText(EPIC_CODE); alert("Copied!")}} className="p-2 text-stone-400 hover:text-white"><Icons.Copy /></button>
                                                </div>
                                                <a href={EPIC_LINK} target="_blank" className="block w-full py-3 bg-blue-600 hover:bg-blue-500 text-center rounded-xl font-bold transition-all shadow-lg shadow-blue-900/20">Log In to Epic!</a>
                                            </div>
                                            <div className="glass p-8 rounded-3xl border border-amber-500/20">
                                                <h2 className="text-2xl font-black text-amber-500 mb-6 text-center">Library</h2>
                                                <div className="grid grid-cols-2 gap-4">
                                                    <a href="https://wingsoffire.fandom.com/" target="_blank" className="p-4 bg-stone-800 rounded-xl text-center font-bold hover:bg-stone-700">Wiki</a>
                                                    <a href="https://kids.scholastic.com/kids/books/wings-of-fire/" target="_blank" className="p-4 bg-stone-800 rounded-xl text-center font-bold hover:bg-stone-700">Books</a>
                                                </div>
                                                <div className="border-t border-white/10 pt-6 mt-6">
                                                    <h3 className="font-bold mb-4 text-amber-500">Trivia Quiz</h3>
                                                    <select onChange={(e)=>setSelectedBook(BOOKS[e.target.selectedIndex])} className="w-full p-3 bg-stone-900 rounded-xl mb-4">{BOOKS.map((b,i)=><option key={i}>{b.title}</option>)}</select>
                                                    {!quizQ ? <button onClick={generateQuiz} className="w-full py-3 bg-amber-700 rounded-xl font-bold">Start Quiz</button> : 
                                                    <div className="space-y-2">
                                                        <p className="font-bold">{quizQ.q}</p>
                                                        {quizQ.opts.map(o=><button key={o} onClick={()=>checkQuiz(o)} className="w-full p-2 bg-stone-800 rounded-lg text-left">{o}</button>)}
                                                        {quizFeedback && <p className="text-center font-bold text-emerald-400 mt-2">{quizFeedback}</p>}
                                                    </div>}
                                                </div>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="flex-1 overflow-y-auto space-y-4 pb-4">
                                            {publicScrolls.length === 0 ? (
                                                <div className="text-center text-stone-500 italic mt-10">The archives are empty. Be the first to write a scroll!</div>
                                            ) : (
                                                publicScrolls.map(scroll => (
                                                    <div key={scroll.id} className="glass p-6 rounded-2xl border-l-4 border-emerald-500">
                                                        <h3 className="text-xl font-bold mb-1">{scroll.title}</h3>
                                                        <div className="flex justify-between text-xs text-stone-400 uppercase tracking-wider mb-4 border-b border-white/10 pb-2"><span>By: {scroll.author} ({scroll.tribe})</span></div>
                                                        <div className="prose prose-invert max-w-none text-sm text-stone-300 leading-relaxed font-serif" dangerouslySetInnerHTML={{__html: scroll.content}} />
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    )}
                                </div>
                            )}

                            {location === 'math' && (
                                <div className="max-w-xl mx-auto glass p-8 rounded-3xl">
                                    <h2 className="text-2xl font-bold mb-4 text-center">Math Cave</h2>
                                    {!mathQ ? <button onClick={generateMathQ} className="w-full py-4 bg-indigo-600 rounded-xl font-bold">Start Problem</button> : 
                                    <div className="space-y-4"><p className="text-xl text-center">{mathQ.q}</p><input type="number" id="ans" className="w-full p-4 bg-stone-900 rounded-xl text-center font-bold outline-none" placeholder="?"/><button onClick={()=>checkMath(document.getElementById('ans').value)} className="w-full py-3 bg-emerald-600 rounded-xl font-bold">Check</button>{mathFeedback && <p className="text-center text-yellow-400 font-bold">{mathFeedback}</p>}</div>}
                                </div>
                            )}

                            {location === 'hall' && <div className="h-full flex items-center justify-center text-center p-8"><h2 className="text-4xl font-black text-stone-800 uppercase italic">Great Hall</h2></div>}
                        </section>
                    </main>
                </div>
            );
        }

        function LoginScreen({ onLogin }) {
            const [name, setName] = useState('');
            const [tribe, setTribe] = useState(TRIBES[0].id);
            return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-stone-950 relative overflow-hidden">
                    <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-emerald-900/30 via-stone-950 to-stone-950"></div>
                    <div className="w-full max-w-md bg-stone-900/80 backdrop-blur-2xl border border-white/10 p-10 rounded-[48px] shadow-2xl relative z-10 text-center">
                        <h1 className="text-4xl font-black tracking-tighter text-emerald-400 italic uppercase">Jade Mountain</h1>
                        <p className="text-[10px] font-black uppercase text-stone-500 tracking-[0.4em] mt-2 mb-8">Academic Portal</p>
                        <form onSubmit={(e)=>{e.preventDefault(); onLogin(name, tribe);}} className="space-y-6 text-left">
                            <div><label className="text-[10px] font-black uppercase text-stone-500 tracking-widest ml-4">Name</label><input required value={name} onChange={(e)=>setName(e.target.value)} className="w-full bg-stone-950/50 border border-white/5 rounded-2xl px-6 py-4 text-stone-100 outline-none" placeholder="e.g. Moonwatcher" /></div>
                            <div><label className="text-[10px] font-black uppercase text-stone-500 tracking-widest ml-4">Tribe</label><div className="grid grid-cols-4 gap-2 mt-1">{TRIBES.map(t => (<button key={t.id} type="button" onClick={()=>setTribe(t.id)} className={`p-2 rounded-xl text-[10px] font-black uppercase transition-all border ${tribe === t.id ? 'bg-emerald-600 border-emerald-400 text-white' : 'bg-stone-950/50 border-white/5 text-stone-500'}`}>{t.id}</button>))}</div></div>
                            <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black uppercase py-5 rounded-2xl shadow-xl mt-4">Start Learning</button>
                        </form>
                    </div>
                </div>
            );
        }

        window.onload = () => { const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />); };
    </script>
</body>
</html>
